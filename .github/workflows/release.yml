# Builds the desktop apps (Windows, macOS, Linux), smoke-tests each one on its own OS,
# and publishes a GitHub Release with the installers plus the website as a zip.
#
# A release is created when "version" in package.json has no release yet: bump the
# version and push to main to cut one. Other runs just build and test (CI).
# Can also be started by hand from the Actions tab ("Run workflow").
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, desktop/**, site/**, scripts/**, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: release/win-unpacked/DocShift.exe
            files: release/DocShift-Windows-Setup.exe
          - os: macos-latest
            exe: release/mac-universal/DocShift.app/Contents/MacOS/DocShift
            files: release/DocShift-macOS.dmg
          - os: ubuntu-latest
            exe: release/linux-unpacked/docshift
            files: release/DocShift-Linux.AppImage release/DocShift-Linux.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        run: npm install --no-audit --no-fund && npm run build
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist -- -c.extraMetadata.version="$(node -p 'require("../package.json").version')"
      - name: Check macOS signature (ad-hoc)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-universal/DocShift.app
          codesign -dv release/mac-universal/DocShift.app 2>&1 | grep -E "Signature|Identifier"
      - name: Smoke test
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node smoke-test.mjs "${{ matrix.exe }}"
          else
            node smoke-test.mjs "${{ matrix.exe }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/DocShift-*.exe
            desktop/release/DocShift-*.dmg
            desktop/release/DocShift-*.AppImage
            desktop/release/DocShift-*.deb
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; builds were tested only."
          fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.version.outputs.exists != 'true'
        run: npm install --no-audit --no-fund && npm run build
      - if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - if: steps.version.outputs.exists != 'true'
        name: Create release
        run: |
          tag="${{ steps.version.outputs.tag }}"
          (cd dist && zip -qr "../DocShift-Web-$tag.zip" .)
          cat > notes.md <<'EOF'
          **🌐 Website: https://poseidondream.github.io/docshift/** (works in the browser, no install needed)

          ## Download

          | System | File |
          |---|---|
          | Windows 10/11 | `DocShift-Windows-Setup.exe` |
          | macOS 11+ (Apple Silicon and Intel) | `DocShift-macOS.dmg` |
          | Linux | `DocShift-Linux.AppImage` (any distro) or `DocShift-Linux.deb` (Ubuntu/Debian) |

          **First launch:** the apps aren't signed with a paid certificate, so
          - Windows: on "Windows protected your PC", click **More info → Run anyway**.
          - macOS: drag DocShift to Applications and open it. When macOS can't verify the developer, go to
            **System Settings → Privacy & Security** and click **Open Anyway**.
          - Linux AppImage: make it executable (`chmod +x DocShift-Linux.AppImage`) and run it.
            The .deb installs with `sudo apt install ./DocShift-Linux.deb`.
          EOF
          gh release create "$tag" installers/* "DocShift-Web-$tag.zip" --target "$GITHUB_SHA" \
            --title "DocShift $tag" --notes-file notes.md --generate-notes
