# Publishes a GitHub Release with the built site attached as a zip (for self-hosting).
# Runs when package.json changes on main: if "version" has no release yet, it creates
# tag v<version> and the release. Bump the version in package.json to cut a new release.
# Can also be started by hand from the Actions tab ("Run workflow").
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.version.outputs.exists != 'true'
        run: npm install --no-audit --no-fund && npm run build
      - if: steps.version.outputs.exists != 'true'
        name: Create release
        run: |
          tag="${{ steps.version.outputs.tag }}"
          (cd dist && zip -qr "../docshift-$tag.zip" .)
          gh release create "$tag" "docshift-$tag.zip" --target "$GITHUB_SHA" \
            --title "DocShift $tag" --generate-notes
